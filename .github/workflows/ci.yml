# Same checks as `make lint`, `make typecheck`, `make test`, and `make security`.
# Jobs are split so a lint failure does not hide a test failure.

name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-mcp.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: make lint
      - run: make typecheck

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: make test

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Full history so gitleaks can see a secret that was committed and later deleted.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
            requirements-mcp.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: make security
